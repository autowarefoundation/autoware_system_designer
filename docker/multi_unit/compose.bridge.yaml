# Topology B: the units as separate ECUs. One bridge network with fixed addresses; every daemon
# listens on its own loopback and is reached through the container's sshd. A forward keeps the
# daemon's port number, which the daemon requires in the Host header. The daemon of main_ecu serves
# the other units through SSH forwards it keeps to their daemons.
name: asd-multi-unit-bridge

x-unit: &unit
  image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
  build:
    context: .
    args:
      ROS_DISTRO: ${ASD_ROS_DISTRO:-humble}
      UID: ${ASD_UID:-1000}
      GID: ${ASD_GID:-1000}
  init: true
  stop_grace_period: 20s
  cap_add:
    - NET_ADMIN # tc netem on the unit's interface
  volumes:
    - ../..:/ws/src/autoware_system_designer:ro
    - ws:/ws/out
    - ${ASD_KEY_DIR:?directory holding authorized_keys, made by run.sh}:/run/asd/keys:ro

x-environment: &environment
  ROS_DOMAIN_ID: ${ASD_ROS_DOMAIN_ID:-87}
  ASD_SSHD_PORT: "2222"

x-serve: &serve
  <<: *unit
  command: serve
  depends_on:
    build:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD-SHELL, "curl -fsS http://127.0.0.1:$${ASD_PORT}/api/health"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  build:
    <<: *unit
    command: build
    environment: *environment
    network_mode: none

  main_ecu:
    <<: *serve
    hostname: main-ecu
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: main_ecu
      ASD_PORT: ${ASD_PORT_MAIN_ECU:-8781}
      ASD_PEERS: >-
        sub_ecu_1=http://127.0.0.1:${ASD_PORT_SUB_ECU_1:-8782}
        sub_ecu_2=http://127.0.0.1:${ASD_PORT_SUB_ECU_2:-8783}
      ASD_PEER_SSH: >-
        sub_ecu_1=${ASD_SUBNET_PREFIX:-172.30.87}.12
        sub_ecu_2=${ASD_SUBNET_PREFIX:-172.30.87}.13
    networks:
      vehicle:
        ipv4_address: ${ASD_SUBNET_PREFIX:-172.30.87}.11

  sub_ecu_1:
    <<: *serve
    hostname: sub-ecu-1
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: sub_ecu_1
      ASD_PORT: ${ASD_PORT_SUB_ECU_1:-8782}
    networks:
      vehicle:
        ipv4_address: ${ASD_SUBNET_PREFIX:-172.30.87}.12

  sub_ecu_2:
    <<: *serve
    hostname: sub-ecu-2
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: sub_ecu_2
      ASD_PORT: ${ASD_PORT_SUB_ECU_2:-8783}
    networks:
      vehicle:
        ipv4_address: ${ASD_SUBNET_PREFIX:-172.30.87}.13

networks:
  vehicle:
    ipam:
      config:
        - subnet: ${ASD_SUBNET_PREFIX:-172.30.87}.0/24

volumes:
  # Built workspace, shared by both topologies and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
