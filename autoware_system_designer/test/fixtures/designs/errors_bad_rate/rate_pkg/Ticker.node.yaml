autoware_system_design_format: 0.4.0

name: Ticker.node

description: Periodic node whose rate names an undefined parameter.

package:
  name: rate_pkg
  provider: dummy

launch:
  plugin: demo::Ticker
  executable: ticker_node
  node_output: screen

subscribers: []

publishers:
  - name: tick
    message_type: std_msgs/msg/Empty

param_files: []

param_values: []

processes:
  - name: tick
    trigger_conditions:
      - periodic: ${parameter missing_rate}
    outcomes:
      - to_output: tick
