<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>System Designer Build</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/daemon/daemon.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="simple-page">
    <div class="page-container">
      <div class="page-header">
        <h1>Build</h1>
        <div class="dark-mode-toggle">
          <label for="dark-mode-switch">Dark Mode</label>
          <div class="toggle-switch" id="dark-mode-switch"></div>
        </div>
      </div>
      <div class="nav-links">
        <a href="/systems.html">Systems</a>
        <span id="connection" class="connection-status">Connecting</span>
      </div>
      <div id="restart-banner" class="daemon-banner" hidden>
        This daemon's package was rebuilt; restart the daemon to run the new
        code.
      </div>
      <div id="error-banner" class="daemon-banner" hidden></div>
      <p class="description">
        Builds run with <code>colcon</code> in <code id="workspace">-</code>.
        One build runs at a time.
      </p>

      <form id="build-form" class="build-form">
        <label
          >System
          <select id="system"></select
        ></label>
        <label
          >Target
          <select id="target">
            <option value="deployment">Deployment package</option>
            <option value="workspace">Packages up to a compute unit</option>
          </select>
        </label>
        <label class="workspace-only"
          >Mode
          <select id="mode"></select
        ></label>
        <label class="workspace-only"
          >Compute unit
          <select id="unit"></select
        ></label>
        <button type="submit" id="start">Start</button>
      </form>

      <h2>Jobs</h2>
      <table class="job-table">
        <thead>
          <tr>
            <th>Job</th>
            <th>Title</th>
            <th>State</th>
            <th>Started</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="jobs">
          <tr>
            <td colspan="5" class="empty">No jobs</td>
          </tr>
        </tbody>
      </table>

      <div id="job-view" hidden>
        <h2 id="job-title"></h2>
        <div class="job-meta"><code id="job-argv"></code></div>
        <div class="job-meta" id="job-packages"></div>
        <pre id="job-log" class="job-log"></pre>
      </div>
    </div>
    <script src="/daemon/build.js"></script>
  </body>
</html>
