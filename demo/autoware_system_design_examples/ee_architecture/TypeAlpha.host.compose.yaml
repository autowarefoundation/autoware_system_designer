# TypeAlpha with its compute units as containers of one ECU. Host network and IPC, one daemon port
# per unit; the daemon of main_ecu serves the other units through their daemons.
# Run by demo/docker/multi_unit/run.sh, which supplies the image context and the source checkout.
name: asd-multi-unit-host

x-unit: &unit
  image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
  build:
    context: ${ASD_DOCKER_DIR:?directory of the Dockerfile, set by run.sh}
    args:
      ROS_DISTRO: ${ASD_ROS_DISTRO:-humble}
      UID: ${ASD_UID:-1000}
      GID: ${ASD_GID:-1000}
  network_mode: host
  ipc: host
  init: true
  stop_grace_period: 20s
  volumes:
    - ${ASD_SOURCE_DIR:?source checkout, set by run.sh}:/ws/src/autoware_system_designer:ro
    - ws:/ws/out

x-environment: &environment
  ROS_DOMAIN_ID: ${ASD_ROS_DOMAIN_ID:-87}
  ROS_LOCALHOST_ONLY: "1"

x-serve: &serve
  <<: *unit
  command: serve
  depends_on:
    build:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD-SHELL, "curl -fsS http://127.0.0.1:$${ASD_PORT}/api/health"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  build:
    <<: *unit
    command: build
    environment: *environment

  main_ecu:
    <<: *serve
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: main_ecu
      ASD_PORT: ${ASD_PORT_MAIN_ECU:-8781}
      ASD_PEERS: >-
        sub_ecu_1=http://127.0.0.1:${ASD_PORT_SUB_ECU_1:-8782}
        sub_ecu_2=http://127.0.0.1:${ASD_PORT_SUB_ECU_2:-8783}

  sub_ecu_1:
    <<: *serve
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: sub_ecu_1
      ASD_PORT: ${ASD_PORT_SUB_ECU_1:-8782}

  sub_ecu_2:
    <<: *serve
    environment:
      <<: *environment
      ASD_COMPUTE_UNIT: sub_ecu_2
      ASD_PORT: ${ASD_PORT_SUB_ECU_2:-8783}

volumes:
  # Built workspace, shared by both topologies and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
