# TypeAlpha with its compute units as containers of one ECU: host network and IPC, DDS on loopback.
# The services and their image are in demo/docker/multi_unit/compose.base.yaml; this file holds the
# binding of each compute unit: its daemon port and, for the unit whose daemon serves the others,
# their daemons as peers.
name: asd-multi-unit-host

x-unit: &unit
  extends:
    file: ${ASD_DOCKER_DIR}/compose.base.yaml
    service: unit
  network_mode: host
  ipc: host
  depends_on:
    build:
      condition: service_completed_successfully

x-variables: &variables
  ROS_LOCALHOST_ONLY: "1"

services:
  build:
    extends:
      file: ${ASD_DOCKER_DIR}/compose.base.yaml
      service: build

  main_ecu:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: main_ecu
      ASD_PORT: 8781
      ASD_PEERS: >-
        sub_ecu_1=http://127.0.0.1:8782
        sub_ecu_2=http://127.0.0.1:8783

  sub_ecu_1:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: sub_ecu_1
      ASD_PORT: 8782

  sub_ecu_2:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: sub_ecu_2
      ASD_PORT: 8783

volumes:
  # Built workspace, shared by every topology and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
