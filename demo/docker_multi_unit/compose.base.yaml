# Services every topology's compose file extends: the workspace build and the daemon of the compute
# units of one execution environment. run.py supplies the source checkout and the site directory,
# which holds the SSH keys and, from the bindings of the topology, the site file of the daemon with
# ASD_MAIN.
services:
  build:
    image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
    build: &image
      context: ${ASD_SOURCE_DIR:?source checkout, set by run.py}
      dockerfile: demo/docker_multi_unit/Dockerfile
      args:
        ROS_DISTRO: ${ASD_ROS_DISTRO:-humble}
        UID: ${ASD_UID:-1000}
        GID: ${ASD_GID:-1000}
    command: build
    init: true
    environment:
      ASD_PACKAGES: ${ASD_PACKAGES:-}
    volumes:
      - ${ASD_SOURCE_DIR:?source checkout, set by run.py}:/ws/src/autoware_system_designer:ro
      - ws:/ws/out

  # Daemon of the compute units ASD_COMPUTE_UNITS on ASD_PORT.
  unit:
    image: asd-multi-unit:${ASD_ROS_DISTRO:-humble}
    build: *image
    command: serve
    init: true
    stop_grace_period: 20s
    environment:
      ROS_DOMAIN_ID: ${ASD_ROS_DOMAIN_ID:-87}
      ASD_RMW_IMPLEMENTATION: ${ASD_RMW_IMPLEMENTATION:-}
    volumes:
      - ${ASD_SOURCE_DIR:?source checkout, set by run.py}:/ws/src/autoware_system_designer:ro
      - ws:/ws/out
      - ${ASD_SITE_DIR:?directory of the keys and the site file, made by run.py}:/run/asd/site:ro
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:$${ASD_PORT}/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30
