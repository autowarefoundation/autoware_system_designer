# TypeAlpha with its compute units as containers of one ECU: host network and IPC, DDS on loopback.
# The services and their image are in demo/docker_multi_unit/compose.base.yaml; this file holds the
# binding of each compute unit: its daemon port and, for the unit whose daemon serves the others,
# their daemons as peers.
name: asd-multi-unit-host

x-unit: &unit
  extends:
    file: ${ASD_DOCKER_DIR}/compose.base.yaml
    service: unit
  network_mode: host
  ipc: host
  depends_on:
    build:
      condition: service_completed_successfully

x-variables: &variables
  ROS_LOCALHOST_ONLY: "1"

services:
  build:
    extends:
      file: ${ASD_DOCKER_DIR}/compose.base.yaml
      service: build

  sensing_perception:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: sensing_perception
      ASD_PORT: 8781
      ASD_PEERS: >-
        map_localization=http://127.0.0.1:8782
        planning_control=http://127.0.0.1:8783

  map_localization:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: map_localization
      ASD_PORT: 8782

  planning_control:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNIT: planning_control
      ASD_PORT: 8783

volumes:
  # Built workspace, shared by every topology and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
