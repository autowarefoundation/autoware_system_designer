# TypeAlpha with its compute units as containers of one ECU: host network and IPC, DDS on loopback.
# The services and their image are in demo/docker_multi_unit/compose.base.yaml; this file states
# where each compute unit runs: its service, device (hostname), address and daemon port, and the
# daemon that has the others as peers (ASD_MAIN).
name: asd-multi-unit-host

x-unit: &unit
  extends:
    file: ${ASD_DOCKER_DIR}/compose.base.yaml
    service: unit
  network_mode: host
  ipc: host
  depends_on:
    build:
      condition: service_completed_successfully

x-variables: &variables
  ROS_LOCALHOST_ONLY: "1"

services:
  build:
    extends:
      file: ${ASD_DOCKER_DIR}/compose.base.yaml
      service: build

  sensing_perception:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNITS: sensing_perception
      ASD_PORT: 8781
      ASD_MAIN: "true"

  map_localization:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNITS: map_localization
      ASD_PORT: 8782

  planning_control:
    <<: *unit
    environment:
      <<: *variables
      ASD_COMPUTE_UNITS: planning_control
      ASD_PORT: 8783

volumes:
  # Built workspace, shared by every topology and kept per ROS distribution.
  ws:
    name: asd-multi-unit-ws-${ASD_ROS_DISTRO:-humble}
