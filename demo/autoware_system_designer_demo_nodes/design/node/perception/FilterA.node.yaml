autoware_system_design_format: 0.4.0

name: FilterA.node

description: Dummy object filter that uses the vector map to constrain incoming detected objects.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_designer_demo_nodes::FilterA
  executable: filter_a_node
  node_output: screen

# interfaces
subscribers:
  - name: ros_transform
    message_type: tf2_msgs/msg/TFMessage
    global: /tf
  - name: vector_map
    message_type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
  - name: objects
    message_type: std_msgs/msg/Int32MultiArray

publishers:
  - name: objects
    message_type: std_msgs/msg/Int32MultiArray
    qos:
      reliability: reliable
      durability: transient_local

param_files:
  - name: filtering_range_param
    default: config/filter_a/filtering_range.param.yaml

param_values: []

# processes
processes:
  - name: filter
    trigger_conditions:
      - and:
          - on_input: objects
          - once: vector_map
    outcomes:
      - to_output: objects
