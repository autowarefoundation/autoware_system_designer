autoware_system_design_format: 0.4.1

name: DetectorA.node

description: Dummy ML-based detector that produces detected objects from an input point cloud.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_designer_demo_nodes::DetectorA
  executable: detector_a_node
  node_output: screen

# interfaces
subscribers:
  - name: pointcloud
    message_type: std_msgs/msg/Float32MultiArray

publishers:
  - name: objects
    message_type: std_msgs/msg/Int32MultiArray
    qos:
      reliability: reliable
      durability: transient_local

param_files:
  - name: model_param_path
    default: config/detector_a/model.param.yaml
    schema: path/to/model_param.schema.json
    allow_substs: true
  - name: ml_package_param_path
    default: config/detector_a/ml_package.param.yaml
    schema: path/to/ml_package_param.schema.json
    allow_substs: true
  - name: class_remapper_param_path
    default: config/detector_a/class_remapper.param.yaml

param_values:
  - name: build_only
    type: bool
    default: false
    description: If true, the node will only build the model and exit.

# processes
processes:
  - name: detection
    description: Runs detection on each input point cloud.
    trigger_conditions:
      - or:
          - on_input: pointcloud
    outcomes:
      - to_output: objects
    expected_latency_ms: 30.0
