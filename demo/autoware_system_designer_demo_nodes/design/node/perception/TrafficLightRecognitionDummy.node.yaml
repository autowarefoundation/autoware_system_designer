autoware_system_design_format: 0.4.0

name: TrafficLightRecognitionDummy.node

description: Dummy traffic light recognition node that recognizes traffic lights in the camera image along the route, publishing car/pedestrian traffic signals, detection ROIs and traffic signal groups.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::TrafficLightRecognitionDummy
  executable: traffic_light_recognition_node

# interfaces
subscribers:
  - name: ros_transform_static
    message_type: tf2_msgs/msg/TFMessage
    global: /tf_static
    qos:
      reliability: reliable
      durability: transient_local
  - name: image
    message_type: std_msgs/msg/UInt8MultiArray
  - name: camera_info
    message_type: std_msgs/msg/Header
  - name: route
    message_type: std_msgs/msg/String

publishers:
  - name: traffic_signal_car
    message_type: std_msgs/msg/ColorRGBA
    qos:
      reliability: reliable
      durability: transient_local
  - name: traffic_signal_pedestrian
    message_type: std_msgs/msg/ColorRGBA
    qos:
      reliability: reliable
      durability: transient_local
  - name: traffic_signal_rois
    message_type: std_msgs/msg/UInt16MultiArray
    qos:
      reliability: reliable
      durability: transient_local
  - name: traffic_signals
    message_type: std_msgs/msg/ColorRGBA

param_files: []
param_values: []

# processes
processes:
  - name: traffic_light_recognition
    trigger_conditions:
      - and:
          - on_input: image
            warn_rate: 0.3 # Hz
            error_rate: 0.3 # Hz
            timeout: 0.5 # s
          - once: route
    outcomes:
      - to_output: traffic_signal_car
      - to_output: traffic_signal_pedestrian
      - to_output: traffic_signal_rois
      - to_output: traffic_signals
