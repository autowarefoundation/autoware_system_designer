autoware_system_design_format: 0.4.1

name: PlanningDummy.node

description: Dummy planning node that periodically produces a mission route from the lanelet map, queued predicted objects and traffic signals.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_designer_demo_nodes::Planning
  executable: planning_node

# interfaces
subscribers:
  - name: ros_transform
    message_type: tf2_msgs/msg/TFMessage
    global: /tf
  - name: lanelet_map
    message_type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
  - name: predicted_objects
    message_type: std_msgs/msg/UInt32MultiArray
  - name: occupancy_grid_map
    message_type: std_msgs/msg/Int8MultiArray
  - name: traffic_signals
    message_type: std_msgs/msg/ColorRGBA
  - name: obstacle_pointcloud
    message_type: std_msgs/msg/Float32MultiArray

publishers:
  - name: mission_planning/route
    message_type: std_msgs/msg/String

param_files: []
param_values: []

# processes
processes:
  - name: queue_predicted_objects
    trigger_conditions:
      - on_input: predicted_objects
    outcomes:
      - to_queue: predicted_objects
  - name: queue_traffic_signals
    trigger_conditions:
      - on_input: traffic_signals
    outcomes:
      - to_queue: traffic_signals
  - name: plan_path
    trigger_conditions:
      - and:
          - periodic: 10.0 # Hz
          - once: lanelet_map
    reads:
      - from_queue: predicted_objects
      - from_queue: traffic_signals
    outcomes:
      - to_output: mission_planning/route
