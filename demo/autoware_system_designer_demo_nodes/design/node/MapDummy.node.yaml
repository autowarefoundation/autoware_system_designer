autoware_system_design_format: 0.4.0

name: MapDummy.node

description: Dummy map node that publishes the vector and point cloud maps and serves partial/differential point cloud map requests.

package:
  name: autoware_system_designer_demo_nodes
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::Mapping
  executable: mapping_node

# interfaces
subscribers: []

publishers:
  - name: vector_map
    message_type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local
  - name: pointcloud_map
    message_type: std_msgs/msg/Float32MultiArray
    qos:
      reliability: reliable
      durability: transient_local

servers:
  - name: get_differential_pointcloud_map
    message_type: std_srvs/srv/Trigger
  - name: get_partial_pointcloud_map
    message_type: std_srvs/srv/Trigger

param_files: []

param_values: []

# processes
processes:
  - name: export
    trigger_conditions:
      - once:
    outcomes:
      - to_output: vector_map
      - to_output: pointcloud_map
