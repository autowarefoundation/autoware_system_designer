autoware_system_design_format: 0.4.1

name: ControlDummy.node

description: Dummy control node that generates vehicle control, gear, hazard-light and turn-indicator commands from the planned route, reading queued kinematics.

package:
  name: autoware_system_dummy_modules
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::Control
  executable: control_node

subscribers:
  - name: mission_planning/route
    message_type: std_msgs/msg/String
  - name: kinematics
    message_type: std_msgs/msg/Float64MultiArray
  - name: acceleration
    message_type: std_msgs/msg/Float64
  - name: emergency_control_cmd
    message_type: std_msgs/msg/Bool

publishers:
  - name: command/control_cmd
    message_type: std_msgs/msg/Float32
  - name: command/gear_cmd
    message_type: std_msgs/msg/UInt8
  - name: command/hazard_lights_cmd
    message_type: std_msgs/msg/Bool
  - name: command/turn_indicators_cmd
    message_type: std_msgs/msg/Int8

param_files: []
param_values: []

# processes
processes:
  - name: queue_kinematics
    trigger_conditions:
      - on_input: kinematics
    outcomes:
      - to_queue: kinematics
  - name: vehicle_control
    trigger_conditions:
      - and:
          - on_input: mission_planning/route
    reads:
      - from_queue: kinematics
    outcomes:
      - to_output: command/control_cmd
