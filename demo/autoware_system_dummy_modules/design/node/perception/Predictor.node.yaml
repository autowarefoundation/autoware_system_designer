autoware_system_design_format: 0.4.0

name: Predictor.node

description: Dummy predictor that produces predicted objects from tracked objects and the lanelet map.

package:
  name: autoware_system_dummy_modules
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::Predictor
  executable: predictor_node

# interfaces
subscribers:
  - name: objects
    message_type: std_msgs/msg/Int64MultiArray
  - name: lanelet_map
    message_type: std_msgs/msg/String
    qos:
      reliability: reliable
      durability: transient_local

publishers:
  - name: objects
    message_type: std_msgs/msg/UInt32MultiArray
    qos:
      reliability: reliable
      durability: transient_local

param_files: []

param_values: []

# processes
processes:
  - name: predict
    trigger_conditions:
      - and:
          - periodic: 10.0 # Hz
            warn_rate: 5.0 # Hz
            error_rate: 2.0 # Hz
            timeout: 0.5 # s
          - on_input: objects
            warn_rate: 3.3 # Hz
            error_rate: 2.0 # Hz
            timeout: 1.0 # s
          - once: lanelet_map
    outcomes:
      - to_output: objects
