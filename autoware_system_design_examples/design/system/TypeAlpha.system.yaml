autoware_system_design_format: 0.4.0

name: TypeAlpha.system

description: Demo system Type Alpha - dummy sensing, map, localization, perception, planning, control and vehicle components spread over main_ecu and dummy ECUs, with a simulation mode that swaps the perception module.

variables:
  - name: vehicle_id
    description: Identifier of the target vehicle, set by the deployment.
  - name: data_path
  - name: lanelet2_map_file
  - name: pointcloud_map_file

variable_files: []

modes:
  - name: default
    description: Default mode
    default: true
  - name: simulation
    description: Simulation mode

components:
  - name: sensing
    entity: SensingDummy.module
    path: /sensing
    compute_unit: main_ecu
  - name: map
    entity: MapDummy.node
    compute_unit: dummy_ecu_1
  - name: localization
    entity: LocalizationDummy.node
    compute_unit: dummy_ecu_1
  - name: object_recognition
    entity: PerceptionA.module
    description: LiDAR object recognition pipeline.
    path: /perception/object_recognition
    compute_unit: main_ecu
    parameter_set: [PerceptionModuleA.parameter_set]
  - name: traffic_light_recognition
    entity: TrafficLightRecognitionDummy.module
    path: /perception/traffic_light_recognition
    compute_unit: main_ecu
  - name: planning
    entity: PlanningDummy.node
    compute_unit: dummy_ecu_2
  - name: control
    entity: ControlDummy.node
    compute_unit: dummy_ecu_2
  - name: vehicle
    entity: VehicleDummy.node
    compute_unit: main_ecu

node_groups:
  - name: pointcloud_container
    type: ros2_component_container_mt
    nodes:
      - /sensing/lidar/*
      - /perception/object_recognition/detector_a1/node_detector
      - /perception/object_recognition/detector_a2/node_detector

connections:
  - - vehicle.publisher.imu
    - localization.subscriber.imu
  - - vehicle.publisher.odometry
    - localization.subscriber.odometry
  - - localization.publisher.kinematic_state
    - sensing.subscriber.odometry
  - - object_recognition.subscriber.pointcloud
    - sensing.publisher.lidar/concatenated/pointcloud
  - - map.publisher.vector_map
    - planning.subscriber.lanelet_map
  - - object_recognition.publisher.objects
    - planning.subscriber.predicted_objects
  - - sensing.publisher.lidar/concatenated/pointcloud
    - localization.subscriber.pointcloud
  - - map.publisher.vector_map
    - localization.subscriber.lanelet_map
  - - object_recognition.subscriber.vector_map
    - map.publisher.vector_map
  # traffic light recognition follows the route it feeds back into planning
  - - sensing.publisher.camera/camera0/image
    - traffic_light_recognition.subscriber.image
  - - sensing.publisher.camera/camera0/camera_info
    - traffic_light_recognition.subscriber.camera_info
  - - planning.publisher.mission_planning/route
    - traffic_light_recognition.subscriber.route
  - - traffic_light_recognition.publisher.traffic_signals
    - planning.subscriber.traffic_signals
  - - planning.publisher.mission_planning/route
    - control.subscriber.mission_planning/route
  - - localization.publisher.kinematic_state
    - control.subscriber.kinematics
  - - control.publisher.command/control_cmd
    - vehicle.subscriber.control_cmd

# mode configuration
simulation:
  override:
    components:
      - name: object_recognition
        entity: PerceptionB.module
        path: /perception/object_recognition
        compute_unit: main_ecu
        parameter_set: [PerceptionModuleABuild.parameter_set]
    node_groups:
      - name: pointcloud_container
        type: ros2_component_container_mt
        nodes:
          - /sensing/lidar/*
          - /perception/object_recognition/detector_a1/node_detector
