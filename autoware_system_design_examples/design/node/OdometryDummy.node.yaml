autoware_system_design_format: 0.4.1

name: OdometryDummy.node

description: Dummy odometry source that publishes vehicle odometry at a fixed rate.

package:
  name: autoware_system_dummy_modules
  provider: dummy

launch:
  plugin: autoware::system_dummy_modules::OdometryDummy

# interfaces
subscribers: []

publishers:
  - name: odometry
    message_type: nav_msgs/msg/Odometry

param_files: []

param_values: []

# processes
processes:
  - name: odometry
    trigger_conditions:
      - periodic: 50.0 # Hz
    outcomes:
      - to_output: odometry
