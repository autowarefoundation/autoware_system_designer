autoware_system_design_format: 0.4.0

name: DemoListener.node

description: demo_nodes_cpp listener printing each chatter message.

package:
  name: demo_nodes_cpp
  provider: ros

launch:
  executable: listener

subscribers:
  - name: chatter
    message_type: std_msgs/msg/String
    remap_target: chatter

publishers: []

param_files: []

param_values: []

processes:
  - name: consume
    trigger_conditions:
      - on_input: chatter
    outcomes: []
