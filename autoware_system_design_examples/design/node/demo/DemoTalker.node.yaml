autoware_system_design_format: 0.4.0

name: DemoTalker.node

description: demo_nodes_cpp talker publishing chatter at 1 Hz.

package:
  name: demo_nodes_cpp
  provider: ros

launch:
  executable: talker

subscribers: []

publishers:
  - name: chatter
    message_type: std_msgs/msg/String

param_files: []

param_values: []

processes:
  - name: publish
    trigger_conditions:
      - periodic: 1.0 # Hz
    outcomes:
      - to_output: chatter
